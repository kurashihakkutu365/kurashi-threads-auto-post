name: Threads connection check (no posting)
on:
  workflow_dispatch:
    inputs:
      expected_username:
        description: '確認するThreadsユーザーネーム（@なし）。トークンを入力しないでください。'
        required: true
        default: kurashi_hakkutsu365
        type: string
permissions:
  contents: read
concurrency:
  group: kurashi-threads-connection-check
  cancel-in-progress: false
jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check account identity without posting
        run: npm run threads:check
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_EXPECTED_USERNAME: ${{ inputs.expected_username }}
