name: Scheduled DRY_RUN (production disabled)
on:
  workflow_dispatch:
  schedule:
    # UTC = Asia/Tokyo - 9h. Scheduled starts can be delayed by GitHub.
    - cron: '0 22 * * *'
    - cron: '10 23 * * *'
    - cron: '30 1 * * *'
    - cron: '20 3 * * *'
    - cron: '0 7 * * *'
    - cron: '40 8 * * *'
    - cron: '0 10 * * *'
permissions:
  contents: read
concurrency:
  group: kurashi-dry-run
  cancel-in-progress: false
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DRY_RUN: 'true'
      STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND || 'sqlite' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run run
      # No uploads, deployment or live publishing. Use the repository variable STORAGE_BACKEND=supabase
      # only after the manual connection check succeeds. Otherwise the local disk remains ephemeral.
