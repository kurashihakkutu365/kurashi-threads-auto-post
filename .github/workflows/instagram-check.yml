name: Instagram connection check (no posting)
on:
  workflow_dispatch:
    inputs:
      expected_username:
        description: '投稿用Instagramのユーザーネーム（@なし）。Threads名やトークンを入力しないでください。'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: kurashi-instagram-connection-check
  cancel-in-progress: false
jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check Instagram account identity without posting
        run: npm run instagram:check
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_EXPECTED_USERNAME: ${{ inputs.expected_username }}
